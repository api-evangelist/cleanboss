name: CleanBoss

description: CleanBoss is a consumer products brand offering non‑toxic, botanically‑derived cleaning solutions. Founded by Joy Mangano and Armando
  Christian Pérez, the company sells multi‑surface cleaners, laundry sheets, fruit‑and‑veggie washes, and other eco‑friendly products through
  its Shopify storefront. The brand emphasizes safety, effectiveness, and a “cleaning revolution” with a 100 % money‑back guarantee and free shipping
  on orders over $45.

